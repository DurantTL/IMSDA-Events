table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0; }
th, td { border: 1px solid var(--line); padding: 7px 9px; vertical-align: top; text-align: left; }

td, li, p { overflow-wrap: anywhere; }
