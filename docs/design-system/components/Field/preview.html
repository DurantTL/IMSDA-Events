<!-- @dsCard group="Forms" height=540 -->
<div class="ds-stage">
  <form class="form-stack" style="max-width:560px" onsubmit="return false">
    <div class="form-grid two-column">
      <label>First name<input value="Morgan"></label>
      <label>Last name<input value="Reed"></label>
    </div>
    <label>Birth date<input class="is-focus" placeholder="MM/DD/YYYY"><span class="field-help">Used to check age limits for honors at events.</span></label>
    <label>Member type<select><option>Pathfinder</option><option>Staff</option></select></label>
    <p class="form-error">Enter a birth date to finish this person's details.</p>
    <label class="check-label"><input type="checkbox" checked> Show inactive people</label>
    <label class="search-field"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="sr-only">Find a person by name</span><input placeholder="Find a person by name"></label>
  </form>
</div>
