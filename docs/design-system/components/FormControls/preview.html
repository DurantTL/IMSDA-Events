<!-- @dsCard group="Forms" height=860 -->
<div class="ds-stage">
  <div class="form-error-summary" role="alert" tabindex="-1" style="max-width:560px">
    <strong><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> 2 things to fix before saving</strong>
    <ul><li><a href="#birth">Birth date: enter a date like 4/17/2014.</a></li><li><a href="#phone">Phone must be a 10-digit number.</a></li></ul>
  </div>
  <form class="form-stack" style="max-width:560px" onsubmit="return false">
    <label class="birth-date-field">Birth date
      <input id="birth" aria-invalid="true" aria-describedby="birth-parsed birth-error" inputmode="numeric" placeholder="M/D/YYYY" value="4/17/14x">
      <span class="field-help birth-date-parsed" id="birth-parsed">Enter a date like 4/17/2014 or 04172014.</span>
      <small class="field-error-message" id="birth-error"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><span>Enter a date like 4/17/2014.</span></small>
    </label>
    <label>Member type<select><option>Pathfinder</option><option>Staff</option></select></label>
    <fieldset class="radio-card-group">
      <legend>Who pays?</legend>
      <div class="radio-card-group-options">
        <label class="radio-card"><input type="radio" name="pays" checked><span>The club<small>One invoice for the whole club.</small></span></label>
        <label class="radio-card"><input type="radio" name="pays"><span>Each family<small>Families pay at registration.</small></span></label>
      </div>
    </fieldset>
    <label class="checkbox-label"><input type="checkbox" checked> Show inactive people</label>
    <div>
      <label class="secondary-button file-button" for="roster-file">Choose a roster file<input class="sr-only" id="roster-file" type="file"></label>
      <p class="disabled-hint">CSV files only, up to 2 MB.</p>
    </div>
    <label class="file-drop selected"><input type="file"><span><strong>riverton-roster.csv</strong><small>18 people found</small></span></label>
  </form>
</div>
