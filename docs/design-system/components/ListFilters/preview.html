<!-- @dsCard group="Data" height=470 -->
<div class="ds-stage">
  <form class="filter-bar" onsubmit="return false">
    <label>Status<select><option>Pending approval</option><option>Confirmed</option></select></label>
    <label>Club<select><option>Riverton Pathfinders</option><option>Cedar Hollow Trailblazers</option></select></label>
    <div class="filter-bar-actions"><button class="primary-button" type="submit">Apply</button><a class="secondary-button" href="#">Clear filters</a></div>
  </form>
  <div class="people-directory__activeBar">
    <ul class="people-directory__activeList" aria-label="Active filters">
      <li class="people-directory__activeChip"><span>Status: Pending approval</span><a class="people-directory__remove" aria-label="Remove Status: Pending approval" href="#"><span aria-hidden="true">&times;</span></a></li>
      <li class="people-directory__activeChip"><span>Club: Riverton Pathfinders</span><a class="people-directory__remove" aria-label="Remove Club: Riverton Pathfinders" href="#"><span aria-hidden="true">&times;</span></a></li>
    </ul>
    <a class="people-directory__clearAll" href="#">Clear filters</a>
  </div>
  <div class="panel selection-bar">
    <span role="status">Tick registrations to email them, or use Select all.</span>
    <div class="selection-bar-actions"><button class="text-button" type="button">Select all 24 shown</button></div>
  </div>
  <div class="panel selection-bar">
    <span role="status"><strong>3</strong> selected</span>
    <div class="selection-bar-actions">
      <button class="text-button" type="button">Select all 24 shown</button>
      <button class="text-button" type="button">Clear selection</button>
      <button class="secondary-button outline-action" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> Email selected</button>
    </div>
  </div>
</div>
