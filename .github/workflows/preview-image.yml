name: Staff preview image

on:
  push:
    branches: [codex/neon-preview-setup]
  workflow_dispatch:

concurrency:
  group: staff-preview-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref == 'refs/heads/codex/neon-preview-setup'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/duranttl/imsda-events-preview
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_PREVIEW_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish staff preview
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_BASE_URL=https://imadventist-staff-preview.onrender.com
            SQUARE_ENVIRONMENT=sandbox
            SQUARE_ENABLE_PRODUCTION=false
            APP_RELEASE_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=staff-preview
          cache-to: type=gha,mode=max,scope=staff-preview

      - name: Request Render preview deployment
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          hook = os.environ["RENDER_DEPLOY_HOOK"]
          image = os.environ["IMAGE"] + "@" + os.environ["IMAGE_DIGEST"]
          separator = "&" if "?" in hook else "?"
          url = hook + separator + urllib.parse.urlencode({"imgURL": image})
          try:
              request = urllib.request.Request(url, data=b"", method="POST")
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in (200, 202):
                      raise SystemExit("Render did not accept the deployment request.")
              print("Render accepted the preview deployment request.")
          except (urllib.error.URLError, TimeoutError):
              # Never print the private hook URL or the response body.
              raise SystemExit("Render deployment request failed; check the preview hook secret.") from None
          PY

      - name: Summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Staff preview image published'
            echo
            echo "Image: \`$IMAGE:latest\`"
            echo "Exact image: \`$IMAGE@$IMAGE_DIGEST\`"
            if [ -z "$RENDER_DEPLOY_HOOK" ]; then
              echo
              echo 'Render connection pending: configure an Existing Image service, then add RENDER_PREVIEW_DEPLOY_HOOK as a repository Actions secret.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
