name: Docker image

# Builds the production image on GitHub and publishes it to GitHub Container
# Registry, so the server pulls a finished image instead of compiling Next for
# 40 minutes on a 4 GB host. Runs once a day at midnight Central (the day's merges
# go live together, when almost no one is filling in a form) and by hand from the Actions tab ("Run workflow") when a
# change can't wait.
#
#   ghcr.io/duranttl/imsda-events:<full commit sha>   (deploy this one)
#   ghcr.io/duranttl/imsda-events:main                 (latest main)
#
# The build arguments are public values baked into metadata and response
# headers (no secrets). Set them as repository variables; the defaults below are
# the production values. Secrets are only ever supplied at runtime (env files).
on:
  # Midnight Central all year (Caleb, October 27, 2026: deploys interrupt anyone
  # submitting a form, so they happen overnight). 05:00 UTC is midnight daylight
  # time, 06:00 UTC is midnight standard time. Whichever runs second finds the
  # image already published and skips, so main is built once a day.
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A scheduled run with no new merges since the last image has nothing to
      # build. A run started by hand always builds.
      - name: Skip if this commit is already published
        id: existing
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && docker manifest inspect "${{ steps.name.outputs.image }}:${{ github.sha }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Image already published for ${{ github.sha }}; nothing to build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.skip != 'true'

      - name: Build and push
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_BASE_URL=${{ vars.APP_BASE_URL || 'https://events.imsda.org' }}
            EMBED_ALLOWED_ORIGINS=${{ vars.EMBED_ALLOWED_ORIGINS || '''self'' https://imsda.org https://*.imsda.org' }}
            SQUARE_ENVIRONMENT=${{ vars.SQUARE_ENVIRONMENT || 'sandbox' }}
            SQUARE_ENABLE_PRODUCTION=${{ vars.SQUARE_ENABLE_PRODUCTION || 'false' }}
            APP_RELEASE_SHA=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The backup scheduler is a separate small image (PostgreSQL 16 client
      # tools, AWS CLI for R2, and scripts/backup/*.sh). It holds no secrets.
      - name: Build and push backup image
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: scripts/backup
          push: true
          tags: |
            ${{ steps.name.outputs.image }}-backup:${{ github.sha }}
            ${{ steps.name.outputs.image }}-backup:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        if: steps.existing.outputs.skip != 'true'
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "${{ steps.name.outputs.image }}:${{ github.sha }}"
            echo "${{ steps.name.outputs.image }}-backup:${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
