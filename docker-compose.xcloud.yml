# Production stack for the events.imsda.org xCloud "Docker Compose" site.
#
# Unlike docker-compose.yml (an all-in-one stack with its own, new Postgres),
# this file runs only the app and the outbox sweeper and connects them to the
# EXISTING production database on the shared xCloud PostgreSQL network. It
# runs the image GitHub already built for the commit instead of compiling Next
# on the 4 GB server. See docs/DEPLOY-DOCKER.md, "xCloud Docker Compose site".
#
# Server files, next to this file in the site directory (both git-ignored, so
# xCloud's `git clean -df` leaves them alone):
#   .env  - the production environment, including DATABASE_URL pointing at the
#           existing database. Compose also reads it for the ${...} values below.
#
# Deploy with scripts/xcloud-compose-deploy.sh (the site's Deploy Script).
services:
  app:
    # scripts/xcloud-compose-deploy.sh sets IMSDA_APP_IMAGE to the image for the
    # deployed commit. The build section is only a fallback for when that
    # image cannot be pulled.
    image: ${IMSDA_APP_IMAGE:-ghcr.io/duranttl/imsda-events:main}
    build:
      context: .
      args:
        APP_BASE_URL: ${APP_BASE_URL:-https://events.imsda.org}
        EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-'self' https://imsda.org https://*.imsda.org}
        SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
        SQUARE_ENABLE_PRODUCTION: ${SQUARE_ENABLE_PRODUCTION:-false}
        APP_RELEASE_SHA: ${APP_RELEASE_SHA:-}
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-}
      ASSET_STORAGE_DIR: /app/storage/event-assets
      # Encryption key file (#876). Uncomment this line AND the key-file entry
      # under volumes only after /etc/imsda/secret-encryption-key exists and the
      # SECRET_ENCRYPTION_KEY line is removed from .env. The app refuses to
      # start with both, or with neither.
      # SECRET_ENCRYPTION_KEY_FILE: /run/secrets/encryption-key
    volumes:
      # Uploaded event files. Without this the site looks healthy but every
      # uploaded file returns 404.
      - imsda_events_assets:/app/storage/event-assets
      # - type: bind
      #   source: /etc/imsda/secret-encryption-key
      #   target: /run/secrets/encryption-key
      #   read_only: true
      #   bind:
      #     create_host_path: false
    ports:
      # xCloud's Nginx forwards the domain to this port. It must not be in use
      # by an old container (the "port is already allocated" error).
      - "127.0.0.1:${APP_PORT:-8100}:3000"
    networks:
      - default
      - postgresql
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      # Migrations and the form and lodging syncs run before the app listens.
      start_period: 300s
    restart: unless-stopped

  # Retries email that failed a first attempt and sends the daily waitlist
  # digest. Replaces the standalone imsda-outbox-sweeper container.
  outbox-sweeper:
    image: curlimages/curl:8.11.1
    depends_on:
      app:
        condition: service_healthy
    environment:
      OUTBOX_SWEEP_TOKEN: ${OUTBOX_SWEEP_TOKEN?set OUTBOX_SWEEP_TOKEN in .env}
      OUTBOX_SWEEP_URL: http://app:3000/api/internal/outbox/sweep
      OUTBOX_SWEEP_INTERVAL_SECONDS: ${OUTBOX_SWEEP_INTERVAL_SECONDS:-300}
    volumes:
      - ./scripts/outbox-sweep.sh:/usr/local/bin/outbox-sweep.sh:ro
    entrypoint: ["sh", "/usr/local/bin/outbox-sweep.sh"]
    restart: unless-stopped

volumes:
  # The existing uploads volume. External, so Compose reuses it instead of
  # creating a new, empty, project-prefixed one.
  imsda_events_assets:
    external: true
    name: imsda_events_assets

networks:
  postgresql:
    external: true
    name: ${IMSDA_POSTGRES_NETWORK:-postgresql_9kgaw_239292_xcloud-network}
