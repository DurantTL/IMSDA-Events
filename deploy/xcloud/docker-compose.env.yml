# xCloud override for the events.imsda.org Dockerfile-only site.
#
# Copy to /home/u_events/.xcloud/docker-compose.env.yml (owner u_events, mode 600).
# xCloud generates a base file with only the build and port (now at
# /home/u_events/239298/docker-compose.yml, $XCLOUD_COMPOSE_FILE); this file adds
# everything it leaves out. The site's Deploy Script passes both files:
#   export APP_RELEASE_SHA="$(git -C "$XCLOUD_SITE_PATH" rev-parse HEAD)"
#   docker compose -f "$XCLOUD_COMPOSE_FILE" -f /home/u_events/.xcloud/docker-compose.env.yml build app
#   docker compose -f "$XCLOUD_COMPOSE_FILE" -f /home/u_events/.xcloud/docker-compose.env.yml up -d app
# See docs/DEPLOY-DOCKER.md, "Permanent xCloud Dockerfile-only runtime override".
#
# Check it before deploying:
#   docker compose -f /home/u_events/239298/docker-compose.yml \
#     -f /home/u_events/.xcloud/docker-compose.env.yml config --quiet && echo config-ok

services:
  app:
    # Absolute paths: Compose resolves relative ones against the FIRST compose
    # file's folder (xCloud's generated /home/u_events/239298), not this one.
    env_file:
      # The production environment xCloud writes from its dashboard, next to
      # its generated compose file. Compose only uses it for ${...} values in
      # the files unless it is listed here.
      - /home/u_events/239298/.env
      # Holds only DATABASE_URL=... (xCloud's .env has no DATABASE_URL).
      - /home/u_events/.xcloud/.env.dburl
    environment:
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-}
      ASSET_STORAGE_DIR: /app/storage/event-assets
      # Encryption key file (#876). Uncomment this line AND the key-file entry
      # under volumes only after /etc/imsda/secret-encryption-key exists and the
      # SECRET_ENCRYPTION_KEY line is removed from .env. The app refuses to
      # start with both, or with neither.
      # SECRET_ENCRYPTION_KEY_FILE: /run/secrets/encryption-key
    volumes:
      # Uploaded event files (badge artwork, schedules, flyers). Without this
      # the site looks healthy but every uploaded file returns 404.
      - imsda_events_assets:/app/storage/event-assets
      # - type: bind
      #   source: /etc/imsda/secret-encryption-key
      #   target: /run/secrets/encryption-key
      #   read_only: true
      #   bind:
      #     create_host_path: false
    networks:
      - default
      - postgresql

volumes:
  # The existing uploads volume used by the manual deployments. It is external
  # so Compose reuses it instead of making a new, empty, project-prefixed one.
  imsda_events_assets:
    external: true
    name: imsda_events_assets

networks:
  postgresql:
    external: true
    name: postgresql_9kgaw_239292_xcloud-network
