# Base compose file for the events.imsda.org xCloud site
# (/home/u_events/239298/docker-compose.yml, $XCLOUD_COMPOSE_FILE).
#
# The app runs the image GitHub builds for each merge to main
# (ghcr.io/duranttl/imsda-events:<sha>). deploy/xcloud/deploy.sh pulls the image
# for the deployed commit and tags it imsda-events:live; this file only ever
# runs that tag, so the site runs the GitHub-built image and nothing it runs is
# built on the server (xCloud's own build is unused and cleaned by
# imsda-cleanup), and a restart by xCloud keeps the deployed version. The release SHA is baked into the image.
#
# xCloud's generated version of this file has no settings, so a container
# started from it refuses to start. Keep this version in place on the server,
# and paste it into the site's Docker Compose page if xCloud offers an editor.
# See docs/DEPLOY-DOCKER.md, "xCloud site setup".
name: xcloud-site-239298
services:
  app:
    image: imsda-events:live
    pull_policy: never
    ports:
      - '127.0.0.1:8100:3100'
    env_file:
      # The production environment from the xCloud dashboard.
      - /home/u_events/239298/.env
      # Only DATABASE_URL=... (the dashboard environment has no DATABASE_URL).
      - /home/u_events/.xcloud/.env.dburl
    environment:
      PORT: '3100'
      ASSET_STORAGE_DIR: /app/storage/event-assets
    volumes:
      # Uploaded event files; without this every uploaded file returns 404.
      - imsda_events_assets:/app/storage/event-assets
    networks:
      - default
      - postgresql
    restart: unless-stopped

volumes:
  imsda_events_assets:
    external: true
    name: imsda_events_assets

networks:
  postgresql:
    external: true
    name: postgresql_9kgaw_239292_xcloud-network
